var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,

<style>
  :root {
    --ink: #212121;
    --ink-soft: #55574f;
    --ink-faint: #8a8c82;
    --lavender: #BFD1FF;
    --lavender-deep: #93AAF5;
    --lavender-pale: #EAF0FF;
    --lime: #D0F246;
    --lime-deep: #5C6512;
    --lime-press: #BEDE2F;
    --paper: #FAFAF6;
    --surface: #FFFFFF;
    --hairline: rgba(33,33,33,0.12);
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 11px;
    --shadow-card: 0 1px 2px rgba(33,33,33,0.04), 0 24px 48px -18px rgba(33,33,33,0.22);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  .accent {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    color: var(--lime-deep);
  }

  .wrap {
    width: 100%;
    max-width: 520px;
    padding: 22px 18px 40px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 20px;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mark svg { width: 17px; height: 17px; }

  .wordmark {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .wordmark .dot-i { color: var(--lime-deep); }

  main { flex: 1; display: flex; flex-direction: column; }

  /* ================= HERO (home screen) ================= */

  .hero-frame {
    position: relative;
    border-radius: var(--radius-xl);
    overflow: hidden;
    background: var(--lavender);
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    margin-bottom: 18px;
    isolation: isolate;
  }

  .hero-art {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .hero-copy {
    position: relative;
    z-index: 1;
    padding: 30px 24px 96px;
  }

  .hero-copy h1 {
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 40px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin: 0;
    color: var(--ink);
  }
  .hero-copy h1 .accent {
    font-size: 1.02em;
    display: block;
  }

  .hero-sub {
    margin-top: 14px;
    font-size: 14.5px;
    color: var(--ink);
    opacity: 0.72;
    max-width: 280px;
    line-height: 1.45;
    font-weight: 500;
  }

  .hero-card {
    position: relative;
    z-index: 2;
    background: var(--surface);
    border-radius: var(--radius-lg);
    margin: 0 16px 16px;
    padding: 20px 20px 18px;
    box-shadow: var(--shadow-card);
  }

  .hero-card-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }

  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .choice-card {
    border-radius: var(--radius-md);
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.16s cubic-bezier(.2,.8,.2,1);
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    border: 1.5px solid var(--hairline);
  }
  .choice-card:active { transform: scale(0.96); }
  .choice-card.receive { background: var(--lavender-pale); border-color: transparent; }
  .choice-card.send { background: var(--paper); }

  .choice-icon {
    width: 34px; height: 34px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: var(--ink);
  }
  .choice-icon svg { width: 16px; height: 16px; stroke: var(--lime); }

  .choice-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  .choice-sub { font-size: 12px; color: var(--ink-faint); margin-top: 1px; font-weight: 500; line-height: 1.3; }

  .trust-line {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-faint);
    font-weight: 500;
    padding: 4px 12px 6px;
  }
  .trust-line b { color: var(--ink); font-weight: 700; }

  /* ================= Panels (waiting / connected states) ================= */

  .panel {
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    border-radius: var(--radius-xl);
    padding: 34px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: var(--shadow-card);
  }

  .beam-visual {
    position: relative;
    width: 128px; height: 128px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
  }
  .beam-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid var(--lavender-deep);
    animation: pulse 2.6s cubic-bezier(.2,.6,.4,1) infinite;
  }
  .beam-ring.r2 { animation-delay: 0.7s; }
  .beam-ring.r3 { animation-delay: 1.4s; }
  @keyframes pulse {
    0% { transform: scale(0.55); opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .beam-core {
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .beam-core svg { width: 24px; height: 24px; }
  .beam-core.connected { background: var(--lime); }
  .beam-core.connected svg { stroke: var(--ink); }

  .status-label {
    font-size: 14.5px; color: var(--ink-soft); font-weight: 500;
    margin-bottom: 22px; text-align: center;
  }

  .code-pill {
    display: inline-flex;
    align-items: center;
    background: var(--ink);
    color: var(--lime);
    border-radius: 980px;
    padding: 14px 26px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
    font-family: "Inter", monospace;
  }

  #qr-canvas {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 1.5px var(--hairline);
    margin-bottom: 8px;
  }

  .hint {
    font-size: 12.5px; color: var(--ink-faint); text-align: center;
    line-height: 1.5; margin-top: 6px; font-weight: 500;
  }

  /* ================= Code entry ================= */

  .code-input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .code-input-row input {
    width: 50px; height: 62px; text-align: center;
    font-size: 26px; font-weight: 800;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--hairline);
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", monospace;
    text-transform: uppercase;
  }
  .code-input-row input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 4px var(--lavender);
  }

  /* ================= Buttons ================= */

  .btn {
    appearance: none; border: none; border-radius: 980px;
    font-size: 15.5px; font-weight: 700;
    padding: 15px 26px; cursor: pointer; width: 100%;
    transition: transform 0.12s, background 0.15s, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--lime); color: var(--ink); }
  .btn-primary:hover { background: var(--lime-press); }
  .btn-primary:disabled { background: #E5E5E0; color: var(--ink-faint); cursor: default; }
  .btn-secondary { background: var(--paper); color: var(--ink); border: 1.5px solid var(--hairline); }
  .btn-secondary:hover { background: var(--lavender-pale); }

  .btn-row { display: flex; gap: 10px; width: 100%; margin-top: 8px; }

  /* ================= Connected / transfer UI ================= */

  .peer-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--ink);
    background: var(--lime);
    padding: 7px 14px; border-radius: 980px;
    margin-bottom: 20px; font-weight: 700;
  }
  .peer-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }

  .dropzone {
    width: 100%;
    border: 1.5px dashed var(--lavender-deep);
    border-radius: var(--radius-lg);
    padding: 36px 18px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 16px;
    background: var(--lavender-pale);
  }
  .dropzone.drag { background: var(--lavender); border-color: var(--ink); }
  .dropzone svg { width: 30px; height: 30px; margin-bottom: 10px; stroke: var(--ink); }
  .dropzone strong { color: var(--ink); font-weight: 800; }

  input[type=file] { display: none; }

  .file-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }

  .file-row {
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .file-icon {
    width: 36px; height: 36px; border-radius: 9px;
    background: var(--lavender-pale);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .file-icon svg { width: 17px; height: 17px; stroke: var(--ink); }

  .file-meta { flex: 1; min-width: 0; }
  .file-name {
    font-size: 13.5px; font-weight: 700; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; font-weight: 500; }

  .progress-track { height: 4px; background: var(--lavender-pale); border-radius: 4px; overflow: hidden; margin-top: 7px; }
  .progress-fill { height: 100%; background: var(--lime); width: 0%; transition: width 0.15s ease-out; border-radius: 4px; }
  .file-row.done .progress-fill { background: var(--ink); }
  .status-check { width: 20px; height: 20px; stroke: var(--ink); flex-shrink: 0; display: none; }
  .file-row.done .status-check { display: block; }
  .file-row.done .progress-track { display: none; }

  /* ================= Modal ================= */

  .overlay {
    position: fixed; inset: 0; background: rgba(33,33,33,0.4);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
    animation: fadein 0.18s ease;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 28px 24px 22px;
    width: 100%; max-width: 320px;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
  }
  .modal-icon {
    width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 14px;
    background: var(--lime);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-icon svg { width: 24px; height: 24px; stroke: var(--ink); }
  .modal h3 { font-size: 18px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; }
  .modal p { font-size: 14px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.45; font-weight: 500; }
  .modal .btn-row { margin-top: 0; }

  footer.foot {
    text-align: center; padding-top: 26px;
    font-size: 11.5px; color: var(--ink-faint); font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) { .beam-ring { animation: none; opacity: 0.4; } }

  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  @media (max-width: 380px) {
    .hero-copy h1 { font-size: 34px; }
    .code-pill { font-size: 28px; padding: 12px 20px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M22 47 L78 24 L58 76 L50 54 Z" fill="#D0F246"/>
          <path d="M22 47 L50 54 L38 60 Z" fill="#BFD1FF"/>
        </svg>
      </div>
      <div class="wordmark">Fl<span class="dot-i">i</span>ng</div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="foot">Files travel device‑to‑device. Nothing sits on a server.</footer>
</div>

<script>
(function () {
  "use strict";

  const CHUNK_SIZE = 16 * 1024;
  const PEER_PREFIX = "fling-room-";
  const CODE_LEN = 4;
  const CODE_CHARS = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";

  const app = document.getElementById("app");

  let peer = null;
  let conn = null;
  let role = null;
  let incomingFiles = {};
  let outgoingQueue = [];
  let sendingActive = false;

  const icons = {
    receive: `<svg viewBox="0 0 24 24" fill="none" stroke="#D0F246" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>`,
    send: `<svg viewBox="0 0 24 24" fill="none" stroke="#D0F246" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M4 5h16"/></svg>`,
    beam: `<svg viewBox="0 0 24 24" fill="none" stroke="#D0F246" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.4"/><path d="M12 2v3.2M12 18.8V22M2 12h3.2M18.8 12H22M4.9 4.9l2.3 2.3M16.8 16.8l2.3 2.3M19.1 4.9l-2.3 2.3M7.2 16.8l-2.3 2.3"/></svg>`,
    check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
    file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>`,
    incoming: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>`,
  };

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  function randomCode() {
    let s = "";
    for (let i = 0; i < CODE_LEN; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }

  function qp(name) { return new URLSearchParams(location.search).get(name); }

  function renderQrOnCanvas(canvas, text) {
    try {
      const qr = qrcode(0, "M"); // typeNumber 0 = auto-select smallest size that fits
      qr.addData(text);
      qr.make();
      const count = qr.getModuleCount();
      const cellSize = 6;
      const margin = 14;
      const size = count * cellSize + margin * 2;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = "#212121";
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect(margin + c * cellSize, margin + r * cellSize, cellSize, cellSize);
          }
        }
      }
      canvas.style.width = "176px";
      canvas.style.height = "176px";
      return true;
    } catch (err) {
      console.error("QR generation failed:", err);
      return false;
    }
  }

  // ================= SCREENS =================

  function renderHome() {
    role = null;
    app.innerHTML = `
      <div class="hero-frame">
        <div class="hero-art">${heroArtSvg()}</div>
        <div class="hero-copy">
          <h1><span class="accent">Fling</span> it there.</h1>
          <div class="hero-sub">Photos, videos, whole folders — straight from this device to the next one, no matter where they sit.</div>
        </div>
        <div class="hero-card">
          <div class="hero-card-title">Choose a side</div>
          <div class="choice-grid">
            <div class="choice-card receive" id="card-receive">
              <div class="choice-icon">${icons.receive}</div>
              <div>
                <div class="choice-title">Receive</div>
                <div class="choice-sub">Get a code to share</div>
              </div>
            </div>
            <div class="choice-card send" id="card-send">
              <div class="choice-icon">${icons.send}</div>
              <div>
                <div class="choice-title">Send</div>
                <div class="choice-sub">Scan or type a code</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="trust-line">Works from <b>any phone or laptop</b> on the same network, or across networks entirely.</div>
    `;
    document.getElementById("card-receive").onclick = startReceiving;
    document.getElementById("card-send").onclick = () => renderEnterCode();
  }

  function heroArtSvg() {
    return `
      <svg viewBox="0 0 520 360" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="position:absolute; inset:0;">
        <defs>
          <radialGradient id="g1" cx="72%" cy="12%" r="80%">
            <stop offset="0%" stop-color="#DCE7FF"/>
            <stop offset="100%" stop-color="#BFD1FF"/>
          </radialGradient>
        </defs>
        <rect width="520" height="360" fill="url(#g1)"/>
        <circle cx="460" cy="40" r="170" fill="#D0F246" opacity="0.5"/>
        <path d="M355 30 L505 95 L430 205 Z" fill="#212121" opacity="0.88"/>
      </svg>
    `;
  }

  function renderWaitingRoom(code) {
    app.innerHTML = `
      <div class="panel">
        <div class="beam-visual">
          <div class="beam-ring r1"></div>
          <div class="beam-ring r2"></div>
          <div class="beam-ring r3"></div>
          <div class="beam-core" id="beam-core">${icons.beam}</div>
        </div>
        <div class="status-label">Waiting for a device to connect…</div>
        <div class="code-pill">${code}</div>
        <canvas id="qr-canvas"></canvas>
        <div class="hint">Scan with a phone camera,<br/>or type the code on the other device.</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
      </div>
    `;
    document.getElementById("cancel-btn").onclick = teardownAndGoHome;

    const url = `${location.origin}${location.pathname}?code=${code}`;
    const qrOk = renderQrOnCanvas(document.getElementById("qr-canvas"), url);
    if (!qrOk) {
      document.getElementById("qr-canvas").outerHTML =
        `<div class="hint" style="color:#B3261E; padding:20px 10px;">Couldn't generate the QR code. Type the code below instead — sharing still works.</div>`;
    }
  }

  function renderEnterCode(prefill) {
    role = null;
    app.innerHTML = `
      <div style="padding: 6px 4px 18px;">
        <h1 style="font-family:'Inter',sans-serif; font-weight:800; font-size:26px; letter-spacing:-0.02em; margin:0 0 6px;">Enter the code</h1>
        <div style="font-size:14px; color:var(--ink-soft); font-weight:500;">Type the 4-character code shown on the receiving device.</div>
      </div>
      <div class="panel" style="padding:28px 20px;">
        <div class="code-input-row" id="code-row">
          ${Array.from({ length: CODE_LEN }).map((_, i) => `<input maxlength="1" inputmode="text" data-i="${i}" autocomplete="off" autocapitalize="characters" />`).join("")}
        </div>
        <button class="btn btn-primary" id="connect-btn" disabled>Connect</button>
        <div id="connect-error" class="hint" style="color:#B3261E; display:none; margin-top:14px;"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="back-btn">Back</button>
      </div>
    `;
    document.getElementById("back-btn").onclick = renderHome;

    const inputs = Array.from(document.querySelectorAll("#code-row input"));
    const connectBtn = document.getElementById("connect-btn");

    function currentCode() { return inputs.map((i) => i.value).join("").toUpperCase(); }
    function updateBtn() { connectBtn.disabled = currentCode().length !== CODE_LEN; }
    inputs.forEach((inp, idx) => {
      inp.addEventListener("input", () => {
        inp.value = inp.value.toUpperCase().slice(-1);
        if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        updateBtn();
      });
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
      });
    });

    if (prefill) {
      prefill.toUpperCase().slice(0, CODE_LEN).split("").forEach((ch, i) => { if (inputs[i]) inputs[i].value = ch; });
      updateBtn();
    }

    connectBtn.onclick = () => {
      if (typeof Peer === "undefined") { showLibraryLoadError(); return; }
      startSending(currentCode());
    };
    setTimeout(() => inputs[prefill ? Math.min(prefill.length, CODE_LEN - 1) : 0].focus(), 50);
  }

  function renderConnectedShell(title) {
    app.innerHTML = `
      <div class="peer-badge"><span class="dot"></span>${title}</div>
      <div id="connected-content"></div>
      <div class="btn-row" style="margin-top:22px;">
        <button class="btn btn-secondary" id="disconnect-btn">Disconnect</button>
      </div>
    `;
    document.getElementById("disconnect-btn").onclick = teardownAndGoHome;
  }

  // ================= RECEIVER FLOW =================

  function startReceiving() {
    if (typeof Peer === "undefined") { showLibraryLoadError(); return; }
    role = "receiver";
    const code = randomCode();
    renderWaitingRoom(code);

    peer = new Peer(PEER_PREFIX + code, { debug: 0 });
    peer.on("open", () => {
      peer.on("connection", (c) => {
        conn = c;
        wireConnection();
        conn.on("open", () => {
          const core = document.getElementById("beam-core");
          if (core) core.classList.add("connected");
          renderReceiverConnected();
        });
      });
    });
    peer.on("error", (err) => showFatalError(err));
  }

  function renderReceiverConnected() {
    renderConnectedShell("Connected");
    document.getElementById("connected-content").innerHTML = `
      <div class="hint" style="margin-top:4px; margin-bottom:18px;">Waiting to receive files. Keep this tab open.</div>
      <div class="file-list" id="incoming-list"></div>
    `;
  }

  // ================= SENDER FLOW =================

  function startSending(code) {
    const errBox = document.getElementById("connect-error");
    role = "sender";
    peer = new Peer({ debug: 0 });
    peer.on("open", () => {
      conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      wireConnection();
      conn.on("open", () => renderSenderConnected());
      setTimeout(() => {
        if (conn && !conn.open) {
          if (errBox) { errBox.style.display = "block"; errBox.textContent = "Couldn't find that code. Check it and try again."; }
          peer.destroy();
        }
      }, 6000);
    });
    peer.on("error", () => {
      if (errBox) { errBox.style.display = "block"; errBox.textContent = "Couldn't connect. Check the code and try again."; }
    });
  }

  function renderSenderConnected() {
    renderConnectedShell("Connected");
    document.getElementById("connected-content").innerHTML = `
      <div class="dropzone" id="dropzone">
        ${icons.file}
        <div><strong>Choose files</strong> or drop them here</div>
      </div>
      <input type="file" id="file-input" multiple />
      <div class="file-list" id="outgoing-list"></div>
    `;
    const dz = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    dz.onclick = () => fileInput.click();
    fileInput.onchange = (e) => queueFiles(Array.from(e.target.files));

    ["dragenter", "dragover"].forEach((evt) => dz.addEventListener(evt, (e) => { e.preventDefault(); dz.classList.add("drag"); }));
    ["dragleave", "drop"].forEach((evt) => dz.addEventListener(evt, (e) => { e.preventDefault(); dz.classList.remove("drag"); }));
    dz.addEventListener("drop", (e) => { queueFiles(Array.from(e.dataTransfer.files)); });
  }

  function queueFiles(files) {
    const list = document.getElementById("outgoing-list");
    files.forEach((file) => {
      const id = crypto.randomUUID();
      const row = document.createElement("div");
      row.className = "file-row";
      row.id = "row-" + id;
      row.innerHTML = `
        <div class="file-icon">${icons.file}</div>
        <div class="file-meta">
          <div class="file-name">${escapeHtml(file.name)}</div>
          <div class="file-sub" id="sub-${id}">${fmtBytes(file.size)} · waiting for approval…</div>
          <div class="progress-track"><div class="progress-fill" id="fill-${id}"></div></div>
        </div>
        <svg class="status-check" id="check-${id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      `;
      list.appendChild(row);
      outgoingQueue.push({ id, file });
    });
    processQueue();
  }

  function processQueue() {
    if (sendingActive || outgoingQueue.length === 0) return;
    const item = outgoingQueue.shift();
    sendingActive = true;
    sendFile(item.id, item.file).finally(() => { sendingActive = false; processQueue(); });
  }

  function sendFile(id, file) {
    return new Promise((resolve) => {
      conn.send({ kind: "meta", id, name: file.name, size: file.size, mime: file.type });
      const onMessage = (msg) => {
        if (msg && msg.kind === "decision" && msg.id === id) {
          conn.off("data", onMessage);
          if (!msg.accepted) { setSub(id, "Declined by the other device"); resolve(); return; }
          streamFile(id, file).then(resolve);
        }
      };
      conn.on("data", onMessage);
    });
  }

  function streamFile(id, file) {
    return new Promise((resolve) => {
      const total = file.size;
      let offset = 0;
      const reader = new FileReader();

      function sendNextChunk() {
        if (offset >= total) {
          conn.send({ kind: "done", id });
          setSub(id, `${fmtBytes(total)} · sent`);
          markDone(id);
          resolve();
          return;
        }
        const slice = file.slice(offset, offset + CHUNK_SIZE);
        reader.onload = () => {
          conn.send(reader.result);
          offset += slice.size;
          updateProgress(id, offset, total);
          if (conn.dataChannel && conn.dataChannel.bufferedAmount > 4 * 1024 * 1024) {
            conn.dataChannel.onbufferedamountlow = () => { conn.dataChannel.onbufferedamountlow = null; sendNextChunk(); };
          } else {
            sendNextChunk();
          }
        };
        reader.readAsArrayBuffer(slice);
      }
      sendNextChunk();
    });
  }

  function updateProgress(id, sent, total) {
    const fill = document.getElementById("fill-" + id);
    const sub = document.getElementById("sub-" + id);
    if (fill) fill.style.width = Math.min(100, (sent / total) * 100) + "%";
    if (sub) sub.textContent = `${fmtBytes(sent)} of ${fmtBytes(total)}`;
  }
  function setSub(id, text) { const sub = document.getElementById("sub-" + id); if (sub) sub.textContent = text; }
  function markDone(id) { const row = document.getElementById("row-" + id); if (row) row.classList.add("done"); }

  // ================= SHARED CONNECTION WIRING =================

  function wireConnection() {
    conn.on("data", handleIncomingData);
    conn.on("close", () => { teardownAndGoHome("The other device disconnected."); });
  }

  function handleIncomingData(data) {
    if (role !== "receiver") return;
    if (data instanceof ArrayBuffer) {
      const active = incomingFiles.__active;
      if (!active) return;
      const f = incomingFiles[active];
      f.chunks.push(data);
      f.received += data.byteLength;
      updateProgress(active, f.received, f.size);
      return;
    }
    if (data && data.kind === "meta") { promptIncoming(data); return; }
    if (data && data.kind === "done") { finalizeIncoming(data.id); }
  }

  function promptIncoming(meta) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-icon">${icons.incoming}</div>
        <h3>Incoming file</h3>
        <p><strong>${escapeHtml(meta.name)}</strong><br/>${fmtBytes(meta.size)}</p>
        <div class="btn-row">
          <button class="btn btn-secondary" id="decline-btn">Decline</button>
          <button class="btn btn-primary" id="accept-btn">Accept</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const cleanup = () => overlay.remove();
    document.getElementById("decline-btn").onclick = () => { conn.send({ kind: "decision", id: meta.id, accepted: false }); cleanup(); };
    document.getElementById("accept-btn").onclick = () => {
      incomingFiles[meta.id] = { name: meta.name, size: meta.size, mime: meta.mime, chunks: [], received: 0 };
      incomingFiles.__active = meta.id;
      addIncomingRow(meta.id, meta.name, meta.size);
      conn.send({ kind: "decision", id: meta.id, accepted: true });
      cleanup();
    };
  }

  function addIncomingRow(id, name, size) {
    const list = document.getElementById("incoming-list");
    if (!list) return;
    const row = document.createElement("div");
    row.className = "file-row";
    row.id = "row-" + id;
    row.innerHTML = `
      <div class="file-icon">${icons.file}</div>
      <div class="file-meta">
        <div class="file-name">${escapeHtml(name)}</div>
        <div class="file-sub" id="sub-${id}">0 B of ${fmtBytes(size)}</div>
        <div class="progress-track"><div class="progress-fill" id="fill-${id}"></div></div>
      </div>
      <svg class="status-check" id="check-${id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    `;
    list.prepend(row);
  }

  function finalizeIncoming(id) {
    const f = incomingFiles[id];
    if (!f) return;
    const blob = new Blob(f.chunks, { type: f.mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    setSub(id, `${fmtBytes(f.size)} · saved`);
    markDone(id);
    delete incomingFiles[id];
    incomingFiles.__active = null;
  }

  // ================= UTIL =================

  function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function showLibraryLoadError() {
    app.innerHTML = `
      <div class="panel">
        <div class="status-label" style="color:#B3261E; font-weight:600;">Couldn't load a required library.</div>
        <div class="hint" style="margin-top:2px;">This usually means your network is blocking a script (common on office/school WiFi, or some ad-blockers). Try switching to mobile data, or a different network, then reload.</div>
        <button class="btn btn-primary" id="reload-btn" style="margin-top:18px;">Reload</button>
      </div>
    `;
    document.getElementById("reload-btn").onclick = () => location.reload();
  }

  function showFatalError(err) {
    console.error(err);
    app.innerHTML = `
      <div class="panel">
        <div class="status-label" style="color:#B3261E;">Something went wrong connecting.<br/>Please try again.</div>
        <button class="btn btn-primary" id="retry-btn" style="margin-top:14px;">Back to start</button>
      </div>
    `;
    document.getElementById("retry-btn").onclick = renderHome;
  }

  function teardownAndGoHome() {
    try { if (conn) conn.close(); if (peer) peer.destroy(); } catch (e) {}
    conn = null; peer = null; incomingFiles = {}; outgoingQueue = []; sendingActive = false;
    renderHome();
  }

  // ================= BOOT =================

  const codeFromUrl = qp("code");
  if (codeFromUrl) { renderEnterCode(codeFromUrl); } else { renderHome(); }
})();
</script>
</body>
</html>
